<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REET Level 1 - Premium Preparation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; font-family: 'Segoe UI', sans-serif; }
    </style>
</head>
<body class="py-10 px-4 text-slate-100">
    <div class="max-w-5xl mx-auto">
        <div class="text-center mb-12 bg-slate-900/80 backdrop-blur-md p-8 rounded-2xl shadow-2xl border-t-4 border-emerald-500 border border-slate-800">
            <h1 class="text-3xl md:text-4xl font-black tracking-tight bg-gradient-to-r from-emerald-400 to-teal-400 bg-clip-text text-transparent mb-2">🎯 REET Level 1 Premium Target</h1>
            <p class="text-slate-400 font-medium">Wife ki safalta ke liye ek shaandar prayas. Har subject mein 1000+ prashno ka sangrah.</p>
        </div>

        <h2 class="text-2xl font-bold text-slate-300 mb-6 flex items-center gap-2">
            <i class="fa-solid fa-book-open text-emerald-400"></i> Apna Syllabus Chunein:
        </h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="syllabus-grid">
            </div>
    </div>

    <script>
        const defaultSubjects = [
            { id: "evs", name: "पर्यावरण अध्ययन (EVS)", icon: "fa-tree", color: "from-green-500/20 to-emerald-600/20", border: "border-emerald-500/30", text: "text-emerald-400" },
            { id: "maths", name: "गणित (Mathematics)", icon: "fa-calculator", color: "from-blue-500/20 to-indigo-600/20", border: "border-blue-500/30", text: "text-blue-400" },
            { id: "psychology", name: "बाल विकास (Psychology)", icon: "fa-brain", color: "from-purple-500/20 to-pink-600/20", border: "border-purple-500/30", text: "text-purple-400" },
            { id: "hindi", name: "भाषा 1 (Hindi)", icon: "fa-language", color: "from-orange-500/20 to-amber-600/20", border: "border-orange-500/30", text: "text-orange-400" },
            { id: "english", name: "भाषा 2 (English)", icon: "fa-font", color: "from-teal-500/20 to-cyan-600/20", border: "border-teal-500/30", text: "text-teal-400" }
        ];

        function loadSyllabus() {
            const grid = document.getElementById('syllabus-grid');
            grid.innerHTML = '';

            defaultSubjects.forEach(sub => {
                grid.innerHTML += `
                    <div class="bg-slate-900 rounded-2xl shadow-xl overflow-hidden hover:shadow-emerald-950/20 transition-all duration-300 transform hover:-translate-y-1 border ${sub.border}">
                        <div class="bg-gradient-to-r ${sub.color} p-6 flex items-center justify-between border-b ${sub.border}">
                            <span class="text-xl font-bold ${sub.text}">${sub.name}</span>
                            <i class="fa-solid ${sub.icon} text-3xl ${sub.text} opacity-80"></i>
                        </div>
                        <div class="p-5 bg-slate-900/50">
                            <p class="text-sm text-slate-400 mb-5"><i class="fa-solid fa-layer-group"></i> Target: 1000+ Questions Solution</p>
                            <button onclick="startQuiz('${sub.id}', '${sub.name}')" class="w-full bg-slate-950 hover:bg-emerald-600 border border-slate-800 hover:border-emerald-500 text-slate-300 hover:text-white font-bold py-3 px-4 rounded-xl transition-all duration-200 flex items-center justify-center gap-2 active:scale-95">
                                Practice Shuru Karein <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function startQuiz(id, name) {
            localStorage.setItem('current_subject_id', id);
            localStorage.setItem('current_subject_name', name);
            window.location.href = 'user.html';
        }

        window.onload = loadSyllabus;
    </script>
</body>
</html>
