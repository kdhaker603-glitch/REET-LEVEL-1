<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REET Level 1 - Premium Preparation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="py-10 px-4">
    <div class="max-w-5xl mx-auto">
        <div class="text-center mb-12 bg-white p-8 rounded-2xl shadow-lg border-t-4 border-indigo-600">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">🎯 REET Level 1 Premium Target</h1>
            <p class="text-gray-600 font-medium">Wife ki safalta ke liye ek shaandar prayas. Har subject mein 1000+ prashno ka sangrah.</p>
            <div class="mt-4 flex justify-center gap-4">
                <a href="admin.html" class="bg-gray-800 hover:bg-gray-950 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow transition-all flex items-center gap-2">
                    <i class="fa-solid fa-user-gear"></i> Admin Panel
                </a>
            </div>
        </div>

        <h2 class="text-2xl font-bold text-gray-700 mb-6 flex items-center gap-2">
            <i class="fa-solid fa-book-open text-indigo-600"></i> Apna Syllabus Chunein:
        </h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="syllabus-grid">
            </div>
    </div>

    <script>
        // Default Syllabus if LocalStorage is empty
        const defaultSubjects = [
            { id: "evs", name: "पर्यावरण अध्ययन (EVS)", icon: "fa-tree", color: "from-green-500 to-emerald-600" },
            { id: "maths", name: "गणित (Mathematics)", icon: "fa-calculator", color: "from-blue-500 to-indigo-600" },
            { id: "psychology", name: "बाल विकास (Psychology)", icon: "fa-brain", color: "from-purple-500 to-pink-600" },
            { id: "hindi", name: "भाषा 1 (Hindi)", icon: "fa-language", color: "from-orange-500 to-amber-600" },
            { id: "english", name: "भाषा 2 (English)", icon: "fa-font", color: "from-teal-500 to-cyan-600" }
        ];

        function loadSyllabus() {
            let subjects = JSON.parse(localStorage.getItem('reet_subjects')) || defaultSubjects;
            if(!localStorage.getItem('reet_subjects')) {
                localStorage.setItem('reet_subjects', JSON.stringify(defaultSubjects));
            }
            
            const grid = document.getElementById('syllabus-grid');
            grid.innerHTML = '';

            subjects.forEach(sub => {
                grid.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 border border-gray-100">
                        <div class="bg-gradient-to-r ${sub.color || 'from-indigo-500 to-purple-600'} p-6 text-white flex items-center justify-between">
                            <span class="text-xl font-bold">${sub.name}</span>
                            <i class="fa-solid ${sub.icon || 'fa-graduation-cap'} text-3xl opacity-80"></i>
                        </div>
                        <div class="p-5">
                            <p class="text-sm text-gray-500 mb-4"><i class="fa-solid fa-layer-group"></i> Target: 1000+ Questions Solution</p>
                            <button onclick="startQuiz('${sub.id}', '${sub.name}')" class="w-full bg-gray-100 hover:bg-indigo-600 hover:text-white text-indigo-600 font-bold py-3 px-4 rounded-xl transition-all duration-200 flex items-center justify-center gap-2">
                                Practice Shuru Karein <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function startQuiz(id, name) {
            localStorage.setItem('current_subject_id', id);
            localStorage.setItem('current_subject_name', name);
            window.location.href = 'user.html';
        }

        window.onload = loadSyllabus;
    </script>
</body>
</html>
